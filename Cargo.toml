[package]
name = "agent-core"
version = "0.4.0"
edition = "2024"
description = "Rust adapters for one-shot Claude, Codex, Devin, and OpenCode v2 CLI runs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tidusvn05/agent-core"

[dependencies]
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
